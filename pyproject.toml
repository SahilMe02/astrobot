[project]
name = "astrobot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SahilMe02", email = "64036377+SahilMe02@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "croniter>=6.2.4",
    "fastapi>=0.141.1",
    "google-adk==1.31.1",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.5.0",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-tasks>=2.26.0",
    "matplotlib>=3.11.2",
    "python-dotenv>=1.0.1",
    "requests>=2.31",
    "sqlglot>=26",
    "uvicorn>=0.54.0",
]

[project.scripts]
astrobot = "astrobot:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-adk[eval]==1.31.1",
    "pytest>=9.1.1",
]
